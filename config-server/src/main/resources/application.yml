server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Repositorio remoto donde vive la configuracion (carpeta config-repo).
          uri: https://github.com/Gandara03/TP-Final-UTN
          search-paths: config-repo
          default-label: main
          clone-on-start: true

---
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          search-locations: file:../config-repo
