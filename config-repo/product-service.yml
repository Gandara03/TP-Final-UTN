server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/productos_db?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
