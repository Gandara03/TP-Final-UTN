server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clientes_db?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:clave-secreta-solo-para-desarrollo-cambiar-en-produccion-1234567890}
  expiration-millis: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
