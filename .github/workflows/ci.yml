# Compila y corre los tests de los microservicios en cada push y pull request.
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # si un servicio falla, los demas terminan igual (asi se ve cuales pasan)
      fail-fast: false
      matrix:
        servicio: [ config-server, eureka-server, product-service, customer-service ]
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # los tests usan H2 en memoria: no necesitan MySQL, Eureka ni el Config Server.
      # -U vuelve a pedir las dependencias si en el cache quedo marcado que alguna no se pudo bajar.
      - name: Compilar y testear
        run: mvn -B -ntp -U verify
